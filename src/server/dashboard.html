<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>shoehorn</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2308090a'/%3E%3Cpath d='M13.2 4h5.6a2 2 0 0 1 2 2v5c0 2.5 3.2 5.7 3.2 10.8 0 4.2-3.8 6.7-8 6.7s-8-2.5-8-6.7c0-5.1 3.2-8.3 3.2-10.8V6a2 2 0 0 1 2-2z' fill='%23d9a54a'/%3E%3Ccircle cx='16' cy='7.6' r='1.5' fill='%2308090a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a quiet console. Header, a hero row (live number | scrolling speed chart), three memory panels (GPU | PCIe | RAM), the hardware row (memory reads | temperatures), then the request list. Dark only, 1px hairlines, one brass accent. */
:root {
  color-scheme: dark;
  --bg: #08090a; --panel: #0e0f11; --raise: #141518; --line: #1d1f23; --line2: #2a2d32;
  --ink: #f2f3f5; --ink2: #9ba1ab; --muted: #5f6570;
  --accent: #d9a54a; --accent-dim: rgba(217,165,74,.14); --read: #6cb6e0; --good: #4cc38a; --warn: #e2b04a; --bad: #ec6a5e;
  --f-ui: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 13px/1.5 var(--f-ui); padding: 0 24px; -webkit-font-smoothing: antialiased; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1280px; margin: 0 auto; padding-block: 18px 48px; display: grid; gap: 16px; }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
.cap { font: 500 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.word { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
.word svg { width: 18px; height: 18px; }
.crumbs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; color: var(--ink2); font: 12px var(--f-mono); }
.crumbs span + span::before { content: "/"; color: var(--line2); margin-right: 6px; }
header .sp { flex: 1; }
.status { display: inline-flex; align-items: center; gap: 7px; font: 12px var(--f-mono); color: var(--ink2); padding: 4px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.status i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.status.writing { color: var(--ink); } .status.writing i { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); animation: beat 1.2s ease-in-out infinite; }
.status.reading i { background: var(--read); animation: beat .7s ease-in-out infinite; }
.status.off i { background: var(--bad); }
@keyframes beat { 50% { opacity: .4; } }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.hero { display: grid; grid-template-columns: minmax(240px, 300px) minmax(0, 1fr); }
@media (max-width: 820px) { .hero { grid-template-columns: 1fr; } }
.now { padding: 20px 22px; border-right: 1px solid var(--line); display: grid; align-content: space-between; gap: 18px; }
@media (max-width: 820px) { .now { border-right: 0; border-bottom: 1px solid var(--line); } }
.big { font: 500 64px/1 var(--f-ui); letter-spacing: -.045em; font-variant-numeric: tabular-nums; margin-top: 8px; }
.big small { font: 400 13px var(--f-mono); letter-spacing: 0; color: var(--ink2); margin-left: 8px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 12.5px; }
.kv dt { color: var(--ink2); } .kv dd { margin: 0; font-family: var(--f-mono); text-align: right; }
.chartbox { padding: 16px 18px 12px; display: grid; gap: 8px; }
.chartbox .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.chartbox .row .mono { color: var(--ink2); font-size: 12px; }
canvas { display: block; width: 100%; }
#speed { height: 190px; }
.prog { height: 6px; border-radius: 3px; background: var(--raise); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--read); transition: width .3s linear; }
.hw { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
@media (max-width: 900px) { .hw { grid-template-columns: 1fr; } }
.hw .mcell + .mcell { border-left: 1px solid var(--line); }
@media (max-width: 900px) { .hw .mcell + .mcell { border-left: 0; border-top: 1px solid var(--line); } }
.temps { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 16px; }
.temp { display: grid; gap: 2px; min-width: 0; }
.temp .n { color: var(--ink2); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.temp .v { font: 500 20px var(--f-ui); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.temp .v small { font: 400 12px var(--f-mono); color: var(--ink2); margin-left: 2px; }
.temp.warm .v { color: var(--warn); } .temp.hot .v { color: var(--bad); }
.note { color: var(--muted); font-size: 12px; }

.mem { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 900px) { .mem { grid-template-columns: 1fr; } }
.mcell { padding: 16px 18px; display: grid; gap: 12px; align-content: start; }
.mcell + .mcell { border-left: 1px solid var(--line); }
@media (max-width: 900px) { .mcell + .mcell { border-left: 0; border-top: 1px solid var(--line); } }
.mhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.mhead b { font-weight: 500; font-size: 13px; }
.mhead .mono { font-size: 12px; color: var(--ink2); }
.mval { font: 500 26px var(--f-ui); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.mval small { font: 400 12px var(--f-mono); color: var(--ink2); letter-spacing: 0; margin-left: 4px; }
.bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--raise); gap: 2px; }
.bar i { display: block; height: 100%; transition: flex-grow .9s cubic-bezier(.2,.7,.2,1); }
.b-w { background: var(--accent); } .b-k { background: var(--read); } .b-o { background: var(--line2); } .b-f { background: transparent; }
.legend { display: grid; gap: 4px; font-size: 12px; color: var(--ink2); }
.legend div { display: flex; justify-content: space-between; gap: 8px; }
.legend i { display: inline-block; width: 6px; height: 6px; border-radius: 1px; margin-right: 8px; vertical-align: 1px; }
.legend .mono { color: var(--ink); }
#link { height: 34px; }

.reqs .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.reqs .top .sum { color: var(--ink2); font-size: 12.5px; }
.reqs .top .sum b { color: var(--ink); font-weight: 500; }
.list { overflow-x: auto; }
.rowh, .r { display: grid; grid-template-columns: 56px 70px 62px 70px 96px 62px 92px 1fr; gap: 12px; padding: 9px 18px; align-items: center; min-width: 800px; }
.r .rd { color: var(--read); }
.rowh { color: var(--muted); font: 500 11px var(--f-mono); text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line); }
.r { border-bottom: 1px solid var(--line); font-size: 12.5px; }
.r:last-child { border-bottom: 0; }
.r .mono { color: var(--ink2); }
.r .t { color: var(--muted); }
.r .spd { color: var(--ink); }
.r.live { background: linear-gradient(90deg, var(--accent-dim), transparent 60%); }
.r.live .spd { color: var(--accent); }
.r.enter { animation: enter .6s ease both; }
@keyframes enter { from { opacity: 0; transform: translateY(-4px); background: var(--accent-dim); } }
.tagz { display: flex; gap: 6px; flex-wrap: wrap; }
.tg { font: 11px var(--f-mono); color: var(--ink2); border: 1px solid var(--line2); border-radius: 4px; padding: 0 6px; white-space: nowrap; }
.tg.bad { color: var(--bad); border-color: rgba(236,106,94,.35); } .tg.warn { color: var(--warn); border-color: rgba(226,176,74,.35); } .tg.good { color: var(--good); border-color: rgba(76,195,138,.35); }
.empty { color: var(--muted); padding: 22px 18px; }
footer { color: var(--muted); font: 11.5px var(--f-mono); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (max-width: 520px) { body { padding: 0 16px; } .big { font-size: 52px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="word">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.2 2h3.6c.7 0 1.2.5 1.2 1.2v3.4c0 1.6 2.1 3.8 2.1 7.1 0 2.8-2.5 4.3-5.1 4.3s-5.1-1.5-5.1-4.3c0-3.3 2.1-5.5 2.1-7.1V3.2C7 2.5 7.5 2 8.2 2z" fill="none" stroke="var(--accent)" stroke-width="1.4"/><circle cx="10" cy="4.6" r=".9" fill="var(--accent)"/></svg>
      shoehorn
    </div>
    <div class="crumbs" id="crumbs"></div>
    <span class="sp"></span>
    <span class="status" id="status"><i></i><span id="statusText">connecting</span></span>
  </header>

  <section class="panel hero">
    <div class="now">
      <div>
        <div class="cap" id="nowCap">Writing speed</div>
        <div class="big" id="big">-<small>tok/s</small></div>
      </div>
      <dl class="kv" id="nowKv"></dl>
    </div>
    <div class="chartbox">
      <div class="row"><span class="cap">Tokens per second, last 2 minutes</span><span class="mono" id="peak"></span></div>
      <canvas id="speed" aria-label="Tokens per second over the last two minutes"></canvas>
    </div>
  </section>

  <section class="panel mem">
    <div class="mcell" id="gpu"></div>
    <div class="mcell" id="pcie"></div>
    <div class="mcell" id="ram"></div>
  </section>

  <section class="panel hw">
    <div class="mcell" id="reads"></div>
    <div class="mcell" id="temps"></div>
  </section>

  <section class="panel reqs">
    <div class="top"><span class="cap">Requests</span><span class="sum" id="sum"></span></div>
    <div class="list">
      <div class="rowh"><span>Time</span><span>Prompt</span><span>Cached</span><span>Read in</span><span>Read speed</span><span>Wrote</span><span>Write speed</span><span>Notes</span></div>
      <div id="rows"></div>
    </div>
  </section>
  <footer><span id="foot"></span><span>live, 4 updates a second</span></footer>
</div>
<script>
const $ = id => document.getElementById(id);
const fmt = (v, d = 0) => v == null || !isFinite(v) ? "-" : Number(v).toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: d });
const k = v => v == null ? "-" : v >= 1e6 ? fmt(v / 1e6, 1) + "M" : v >= 1e4 ? fmt(v / 1e3) + "K" : v >= 1e3 ? fmt(v / 1e3, 1) + "K" : fmt(v);
const GiB = 1073741824, gb = b => b == null ? "-" : fmt(b / GiB, 1);
const dur = s => s == null || !isFinite(s) ? "-" : s < 1 ? fmt(s * 1000) + " ms" : s < 60 ? fmt(s, s < 10 ? 1 : 0) + " s" : s < 3600 ? Math.floor(s / 60) + " min" : fmt(s / 3600, 1) + " h";
const clock = t => new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const sum = (a, f) => a.reduce((s, r) => s + (f(r) || 0), 0);
const pct = (a, b) => b > 0 ? 100 * a / b : null;
const plural = (n, w, ws) => `${fmt(n)} ${n === 1 ? w : ws || w + "s"}`;
const C = { accent: "#d9a54a", read: "#6cb6e0", ink2: "#9ba1ab", muted: "#5f6570", line: "#1d1f23", line2: "#2a2d32", bad: "#ec6a5e" };
const GAP = 300;
const nowS0 = () => Date.now() / 1000;

let ALL = [], newest = -1, live = {}, cfg = {}, mem = {}, loaded = "";
let prevGen = null, prevT = null, rate = null, shown = null, target = null, genHist = [];
let samples = [];   // {t (s), v}
let hw = {}, reads = [];   // reads: {t (s), v (VRAM bytes), r (RAM bytes)} for the read rates
let readHist = [];         // {t, n}: prompt tokens read, for the live reading speed
let seenRows = new Set();

function fit(cv) {
  const r = cv.getBoundingClientRect(), dpr = Math.max(1, Math.min(2, devicePixelRatio || 1));
  const w = Math.max(10, Math.round(r.width * dpr)), h = Math.max(10, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { g, W: r.width, H: r.height };
}

// ---- speed chart: continuous scroll, smoothed line, dotted grid, live endpoint
function drawSpeed(nowS) {
  const { g, W, H } = fit($("speed")), span = 120, padL = 34, padB = 18;
  g.clearRect(0, 0, W, H);
  const pts = samples.filter(p => nowS - p.t <= span + 2);
  const vals = pts.filter(p => p.v != null).map(p => p.v);
  const top = Math.max(40, Math.ceil(Math.max(0, ...vals) * 1.15 / 20) * 20);
  const X = t => padL + (W - padL) * (1 - (nowS - t) / span), Y = v => (H - padB) - (H - padB - 8) * v / top;
  g.font = "11px 'Geist Mono', monospace"; g.fillStyle = C.muted; g.textAlign = "right";
  for (let i = 0; i <= 4; i++) {
    const v = top * i / 4, y = Math.round(Y(v)) + .5;
    g.strokeStyle = i ? C.line : C.line2; g.setLineDash(i ? [2, 4] : []); g.beginPath(); g.moveTo(padL, y); g.lineTo(W, y); g.stroke();
    g.fillText(fmt(v), padL - 8, y + 3.5);
  }
  g.setLineDash([]); g.textAlign = "center";
  for (const s of [120, 90, 60, 30]) g.fillText(s === 120 ? "-2 min" : `-${s}s`, X(nowS - s), H - 3);
  // segments where the model was writing
  let seg = [];
  const segs = [];
  for (const p of pts) { if (p.v == null) { if (seg.length) segs.push(seg); seg = []; } else seg.push(p); }
  if (seg.length) segs.push(seg);
  for (const s of segs) {
    if (s.length < 2) continue;
    g.beginPath();
    s.forEach((p, i) => { const x = X(p.t), y = Y(p.v); if (!i) g.moveTo(x, y); else { const q = s[i - 1], mx = (X(q.t) + x) / 2; g.bezierCurveTo(mx, Y(q.v), mx, y, x, y); } });
    g.strokeStyle = C.accent; g.lineWidth = 1.5; g.stroke();
    g.lineTo(X(s[s.length - 1].t), H - padB); g.lineTo(X(s[0].t), H - padB); g.closePath();
    const grd = g.createLinearGradient(0, 0, 0, H); grd.addColorStop(0, "rgba(217,165,74,.22)"); grd.addColorStop(1, "rgba(217,165,74,0)");
    g.fillStyle = grd; g.fill();
  }
  const last = pts[pts.length - 1];
  if (last && last.v != null && live.busy) {
    const x = X(last.t), y = Y(last.v);
    g.fillStyle = C.accent; g.beginPath(); g.arc(x, y, 3, 0, 7); g.fill();
    g.strokeStyle = "rgba(217,165,74,.35)"; g.beginPath(); g.arc(x, y, 7 + 2 * Math.sin(nowS * 6), 0, 7); g.stroke();
  }
  if (!vals.length) { g.fillStyle = C.muted; g.textAlign = "center"; g.font = "12px Geist, sans-serif"; g.fillText("The line draws itself while shoehorn writes.", padL + (W - padL) / 2, (H - padB) / 2); }
}
// ---- PCIe link: a hairline with a light running along it while the residual streams
function drawLink(nowS) {
  const { g, W, H } = fit($("link")), y = H / 2;
  g.clearRect(0, 0, W, H);
  g.strokeStyle = C.line2; g.lineWidth = 1; g.beginPath(); g.moveTo(0, y + .5); g.lineTo(W, y + .5); g.stroke();
  g.fillStyle = C.muted; g.font = "10px 'Geist Mono', monospace"; g.textAlign = "left"; g.fillText("RAM", 0, y - 7); g.textAlign = "right"; g.fillText("GPU", W, y - 7);
  const writing = live.busy && live.gen > 0, reading = live.busy && !writing;
  if (!writing && !reading) return;
  const speed = writing ? 1.6 : .8, col = writing ? "217,165,74" : "108,182,224";
  for (let i = 0; i < 3; i++) {
    const p = ((nowS * speed + i / 3) % 1), x = p * W;
    const grd = g.createLinearGradient(x - 70, 0, x, 0); grd.addColorStop(0, `rgba(${col},0)`); grd.addColorStop(1, `rgba(${col},.95)`);
    g.strokeStyle = grd; g.lineWidth = 2; g.beginPath(); g.moveTo(Math.max(0, x - 70), y + .5); g.lineTo(x, y + .5); g.stroke();
  }
}

// ---- data helpers
function annotate(R) {
  let main = null, prevEnd = -Infinity;
  for (const r of R) {
    r.start = r.t - (r.prefill_s || 0) - (r.decode_s || 0);
    if (r.start - prevEnd > GAP) main = null;
    prevEnd = Math.max(prevEnd, r.t);
    r.isSide = r.side === "parked" || r.side == null && main != null && main.prompt_tokens > 4000 && r.prompt_tokens < main.prompt_tokens * 0.4 && r.reused_tokens < 256;
    const fresh = r.prompt_tokens - r.reused_tokens;
    r.miss = !r.isSide && main != null && main.prompt_tokens > 2000 && r.prompt_tokens >= main.prompt_tokens * 0.8 && fresh > Math.max(2000, r.prompt_tokens * 0.5);
    r.loop = (r.reasoning_repeat || 0) > .3 || (r.content_repeat || 0) > .3;
    r.warmup = r.gen_tokens <= 2 && r.prompt_tokens < 300;
    if (!r.isSide && !r.warmup) main = r;
  }
}
function session() {
  let s = null;
  for (const r of ALL) { if (r.warmup) continue; if (!s || r.start - s.end > GAP) s = { start: r.start, end: r.t, R: [r] }; else { s.R.push(r); s.end = r.t; } }
  return s;
}
const speedOf = R => { const D = R.filter(r => r.gen_tokens >= 16), d = sum(D, r => r.decode_s); return d > 0 ? sum(D, r => r.gen_tokens) / d : null; };
// prompt reading: the new (uncached) tokens and how fast they were read; a speed only when there were enough of them
const readTime = r => r.prefill_s > 0 ? dur(r.prefill_s) : "-";
const readRate = r => { const fresh = r.prompt_tokens - r.reused_tokens;
  return r.prefill_s > 0 && fresh >= 256 ? `${k(fresh / r.prefill_s)} tok/s` : "-"; };
const readSpeed = R => { const B = R.filter(r => r.prompt_tokens - r.reused_tokens >= 256 && r.prefill_s > 0);
  const s = sum(B, r => r.prefill_s); return s > 0 ? sum(B, r => r.prompt_tokens - r.reused_tokens) / s : null; };
const lastSpec = () => [...ALL].reverse().find(r => r.spec && r.spec.cycles && r.gen_tokens >= 16);

// ---- DOM
function renderHeader(d) {
  const c = [];
  c.push(`<span>${d.loaded ? d.loaded.replace(/^qwen3\.8-/, "").replace(/-shoehorn$/, "") : "no model loaded"}</span>`);
  if (cfg.ctx) c.push(`<span>ctx ${k(cfg.ctx)}</span>`);
  if (cfg.kv) c.push(`<span>kv ${cfg.kv}${cfg.kv_v && cfg.kv_v !== cfg.kv ? "/" + cfg.kv_v : ""}</span>`);
  if (cfg.window && d.loaded) c.push(`<span>vram window ${k(cfg.window)}</span>`);
  const h = c.join(""); if ($("crumbs").dataset.h !== h) { $("crumbs").innerHTML = h; $("crumbs").dataset.h = h; }
  const writing = live.busy && live.gen > 0, reading = live.busy && !writing;
  $("status").className = "status" + (writing ? " writing" : reading ? " reading" : live.down ? " off" : "");
  $("statusText").textContent = live.down ? "offline" : writing ? "writing" : reading ? "reading prompt" : loaded ? "idle" : "idle, model unloaded";
}
function renderNow() {
  const writing = live.busy && live.gen > 0, reading = live.busy && !writing;
  const last = [...ALL].reverse().find(r => r.gen_tokens >= 16), ls = lastSpec();
  let cap, val, rows;
  if (writing) {
    cap = "Writing now"; target = rate ?? (live.elapsed_s > 0 ? live.gen / live.elapsed_s : 0);
    rows = [["Tokens so far", fmt(live.gen)], ["Elapsed", dur(live.elapsed_s)], ["Prompt", k(live.prompt) + " tok"]];
  } else if (reading) {
    cap = "Reading the prompt"; target = readRateNow();
    const done = live.read ?? 0, left = live.prompt - done, rr = readRateNow();
    rows = [["Read", `${k(done)} of ${k(live.prompt)} tok`], ["", `<div class="prog"><i style="width:${fmt(pct(done, live.prompt) || 0, 1)}%"></i></div>`],
            ["Elapsed", dur(live.elapsed_s)], ["Left", rr && left > 0 ? "about " + dur(left / rr) : "-"]];
  } else {
    cap = last ? "Last answer" : "Writing speed"; target = last ? last.gen_tokens / last.decode_s : null;
    rows = last ? [["Tokens", fmt(last.gen_tokens)], ["Finished", dur(Date.now() / 1e3 - last.t) + " ago"],
                   ["Prompt", `${k(last.prompt_tokens)}, ${fmt(pct(last.reused_tokens, last.prompt_tokens), 0)}% cached`],
                   ["Prompt read in", readTime(last) + (readRate(last) !== "-" ? ", " + readRate(last) : "")],
                   ...(ls ? [["Per check", `${fmt(ls.gen_tokens / ls.spec.cycles, 1)} tok in ${fmt(1000 * ls.spec.verify_s / ls.spec.cycles, 0)} ms`]] : [])] : [["", ""]];
  }
  $("nowCap").textContent = cap;
  $("big").dataset.unit = reading ? "tok/s read" : "tok/s";
  const h = rows.filter(r => r[0] || r[1]).map(([a, b]) => a ? `<dt>${a}</dt><dd>${b}</dd>` : `<dd style="grid-column:1/-1">${b}</dd>`).join("");
  if ($("nowKv").dataset.h !== h) { $("nowKv").innerHTML = h; $("nowKv").dataset.h = h; }
}
// prompt tokens read per second over the last 2 s of polls
function readRateNow() {
  if (readHist.length < 2) return null;

  return b.t - a.t >= .5 && b.n > a.n ? (b.n - a.n) / (b.t - a.t) : null;
}
function tweenBig() {  // the number eases toward its target instead of jumping
  const unit = $("big").dataset.unit || "tok/s";
  if (target == null) { $("big").innerHTML = `${live.busy ? "..." : "-"}<small>${unit}</small>`; shown = null; return; }
  shown = shown == null ? target : shown + (target - shown) * .12;
  $("big").innerHTML = `${fmt(shown, 0)}<small>${unit}</small>`;
}
function renderMem() {
  const m = mem;
  if (!m.vram_total) return;
  const wG = loaded ? (m.weights_gpu || 0) : 0, wC = loaded ? (m.residual || 0) + (m.weights_cpu || 0) : 0, kv = m.kv_ram || 0;
  const vUsed = m.vram_total - m.vram_free, vOther = Math.max(0, vUsed - wG), rUsed = m.ram_total - m.ram_avail, rOther = Math.max(0, rUsed - wC - kv);

  if ($("gpu").dataset.h !== gpu) { $("gpu").innerHTML = gpu; $("gpu").dataset.h = gpu; }
  if ($("ram").dataset.h !== ram) { $("ram").innerHTML = ram; $("ram").dataset.h = ram; }

  const perCheckS = ls ? ls.spec.verify_s / ls.spec.cycles : null, bw = perCheckS && res ? res / perCheckS : null;
  const writing = live.busy && live.gen > 0;

    <div class="mval">${bw ? fmt(bw / 1e9, 0) : "-"}<small>GB/s during a check</small></div>
    <canvas id="link"></canvas>
    <div class="legend"><div><span>Residual sent per check</span><span class="mono">${res ? gb(res) + " GB" : "-"}</span></div>

// ---- hardware: weight bytes read (counted per pass of the model, see traffic.h) and temperatures
const GB = 1e9;
function rateOf(key) {
  if (reads.length < 2) return null;
  const a = reads[0], b = reads[reads.length - 1];
  return b.t - a.t >= 1 ? (b[key] - a[key]) / (b.t - a.t) : null;
}
function renderHw() {
  if (hw.vram_read == null) return;
  const vr = rateOf("v"), rr = rateOf("r"), g = hw.gpu || {};
  const line = (l, v) => `<div><span>${l}</span><span class="mono">${v}</span></div>`;
  const r = `<div class="mhead"><b>Memory reads</b><span class="mono">model weights, since start</span></div>
    <div class="mval">${vr != null && vr > 0 ? fmt(vr / GB, 0) : "0"}<small>GB/s from VRAM now</small></div>
    <div class="legend">${line("Read from VRAM", fmt(hw.vram_read / GB, 0) + " GB")}${line("Read from RAM, across PCIe", fmt(hw.ram_read / GB, 0) + " GB")}
      ${line("RAM read rate now", rr != null && rr > 0 ? fmt(rr / GB, 1) + " GB/s" : "0 GB/s")}
      ${g.mem_util != null && g.mem_util >= 0 ? line("VRAM busy", g.mem_util + "%") : ""}${g.power_w != null && g.power_w >= 0 ? line("GPU power", fmt(g.power_w, 0) + " W") : ""}</div>
    <div class="note">Counted from the weights each pass of the model reads; the context cache and activations add more.</div>`;
  if ($("reads").dataset.h !== r) { $("reads").innerHTML = r; $("reads").dataset.h = r; }
  // temperatures: NVML for the GPU core, Windows for the drives, LibreHardwareMonitor (when running) for the rest
  const T = [], S = hw.sensors || [];
  const pick = (kind, re) => S.filter(x => x.kind.startsWith(kind) && (!re || re.test(x.name)));
  const cpu = pick("amdcpu", /Tctl|Tdie|Package|CCD/).concat(pick("intelcpu", /Package/));
  if (cpu.length) T.push({ n: "CPU", c: Math.max(...cpu.map(x => x.c)) });
  if (g.temp_c != null && g.temp_c >= 0) T.push({ n: "GPU core", c: g.temp_c });
  const vram = pick("gpu-nvidia", /Memory/i);
  if (vram.length) T.push({ n: "VRAM", c: Math.max(...vram.map(x => x.c)) });
  const ram = S.filter(x => x.kind === "memory" && /^DIMM/i.test(x.name));  // not the limit / resolution entries
  ram.forEach((x, i) => T.push({ n: ram.length > 1 ? `RAM ${i + 1}` : "RAM", c: x.c, title: `${x.hw} ${x.name}` }));
  for (const d of hw.drives || []) T.push({ n: d.name.replace(/\s*\[.*\]$/, ""), c: d.temp_c, title: d.name });
  const cls = c => c >= 85 ? " hot" : c >= 70 ? " warm" : "";
  const missing = [cpu.length ? null : "CPU", vram.length ? null : "VRAM", ram.length ? null : "RAM"].filter(Boolean);
  const t = `<div class="mhead"><b>Temperatures</b><span class="mono">${S.length ? "with LibreHardwareMonitor" : "GPU and drives"}</span></div>
    <div class="temps">${T.map(x => `<div class="temp${cls(x.c)}" title="${x.title || x.n}"><span class="n">${x.n}</span><span class="v">${fmt(x.c, 0)}<small>C</small></span></div>`).join("")}</div>
    ${missing.length ? `<div class="note">${missing.join(", ")}: ${S.length ? "not reported by LibreHardwareMonitor" : "start LibreHardwareMonitor with its web server on port 8085"}.</div>` : ""}`;
  if ($("temps").dataset.h !== t) { $("temps").innerHTML = t; $("temps").dataset.h = t; }
}
function renderList() {
  annotate(ALL);
  const s = session();
  const R = s ? s.R : [];
  const prompt = sum(R, r => r.prompt_tokens), reused = sum(R, r => r.reused_tokens), misses = R.filter(r => r.miss).length;
  const isLive = s && (live.busy || Date.now() / 1e3 - s.end < GAP);
  $("sum").innerHTML = s ? `${isLive ? "Current" : "Last"} session, started ${clock(s.start).slice(0, 5)}, <b>${plural(R.length, "request")}</b>, <b>${k(sum(R, r => r.gen_tokens))}</b> tokens, <b>${fmt(speedOf(R), 0)}</b> tok/s writing${readSpeed(R) ? `, prompts read at <b>${k(readSpeed(R))}</b> tok/s` : ""}, <b>${fmt(pct(reused, prompt), 0)}%</b> cached${misses ? `, <b>${plural(misses, "miss", "misses")}</b>` : ""}` : "No requests yet";
  let html = "";
  if (live.busy) {
    html += `<div class="r live"><span class="mono t">now</span><span class="mono">${k(live.prompt)}</span><span class="mono">-</span><span class="mono">${live.gen > 0 ? "done" : dur(live.elapsed_s)}</span><span class="mono rd">${live.gen > 0 ? "-" : readRateNow() ? k(readRateNow()) + " tok/s" : "..."}</span><span class="mono">${fmt(live.gen)}</span><span class="mono spd">${live.gen > 0 ? fmt(rate ?? live.gen / Math.max(.1, live.elapsed_s), 0) + " tok/s" : "-"}</span><span class="tagz"><span class="tg">${live.gen > 0 ? "writing" : "reading prompt"}</span></span></div>`;
  }

    if (r.side === "resumed") tg.push(`<span class="tg good">resumed</span>`);
    if (r.tool_calls) tg.push(`<span class="tg">${plural(r.tool_calls, "tool call")}</span>`);
    if (r.loop) tg.push(`<span class="tg warn">repetition</span>`);

    html += `<div class="r${fresh && renderList.ready ? " enter" : ""}"><span class="mono t">${clock(r.t).slice(0, 5)}</span><span class="mono">${k(r.prompt_tokens)}</span><span class="mono">${fmt(pct(r.reused_tokens, r.prompt_tokens), 0)}%</span><span class="mono">${readTime(r)}</span><span class="mono rd">${readRate(r)}</span><span class="mono">${fmt(r.gen_tokens)}</span><span class="mono spd">${r.gen_tokens >= 16 ? fmt(r.gen_tokens / r.decode_s, 0) + " tok/s" : "-"}</span><span class="tagz">${tg.join("")}</span></div>`;

  renderList.ready = true;
  $("foot").textContent = s && !isLive ? `Last activity ${dur(Date.now() / 1e3 - s.end)} ago` : "";
}

// ---- polling
async function poll() {
  let d;
  try { d = await (await fetch("/stats?since=" + newest, { cache: "no-store" })).json(); }
  catch (e) { live = { down: true }; $("status").className = "status off"; $("statusText").textContent = "offline"; return; }
  for (const r of d.recent || []) if (r.t > newest) { ALL.push(r); newest = r.t; }
  const nowP = performance.now(), nowS = Date.now() / 1000, was = live;
  live = d.live || {}; cfg = d.config || {}; mem = d.mem || {}; loaded = d.loaded || ""; hw = d.hw || {};
  if (hw.vram_read != null) { reads.push({ t: nowS0(), v: hw.vram_read, r: hw.ram_read }); while (reads.length > 2 && nowS0() - reads[1].t >= 2) reads.shift(); }
  if (live.busy && live.reading) { readHist.push({ t: nowS0(), n: live.read || 0 }); while (readHist.length > 2 && nowS0() - readHist[1].t >= 2) readHist.shift(); }
  else readHist = [];

    // the answer's first tokens arrived during the last poll interval: anchor 0 tokens just before them

  const inSession = live.busy || (live.last_end_s != null && live.last_end_s < 60);
  samples.push({ t: nowS, v: writing && rate != null ? rate : inSession ? 0 : null });
  samples = samples.filter(p => nowS - p.t <= 125);
  renderHeader(d); renderNow(); renderMem(); renderHw();
  if (!poll.n || poll.n % 4 === 0 || (was.busy !== live.busy)) renderList();

}
function frame() {
  const nowS = Date.now() / 1000;

}
poll(); setInterval(poll, 250);
requestAnimationFrame(frame);
addEventListener("load", () => renderMem());
