<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>shoehorn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;700;900&family=Chivo+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: a single-screen cockpit. Live speed and the token belt fill the left, the memory column (RAM -> PCIe -> GPU) stands on the right, the session strip runs along the bottom. Dark only, by choice. */
:root {
  color-scheme: dark;
  --bg: #090b0e; --deck: #10141a; --deck2: #151a21; --ink: #e9ecef; --ink2: #9aa4ae; --muted: #5d6874; --line: #1f2630;
  --brass: #e4ac4c; --brass-dim: #6b5224; --cyan: #5cc0e6; --cyan-dim: #1f4d61; --good: #4fca72; --warn: #e8b13a; --bad: #f06a6a;
  --f-ui: "Chivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "Chivo Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-ui); padding: 0 18px; overflow-x: hidden; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.cockpit { max-width: 1500px; margin: 0 auto; min-height: 100%; padding-block: 14px 16px; display: grid; grid-template-rows: auto 1fr auto; gap: 14px; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

/* top bar */
.bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.mark { display: flex; align-items: center; gap: 9px; font-weight: 900; font-size: 19px; letter-spacing: -.01em; }
.mark svg { width: 26px; height: 26px; }
.tag { font: 500 12px var(--f-num); color: var(--ink2); border: 1px solid var(--line); background: var(--deck); border-radius: 5px; padding: 3px 8px; white-space: nowrap; }
.tag b { color: var(--ink); font-weight: 500; }
.bar .sp { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 8px; font: 700 12px var(--f-num); letter-spacing: .12em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink2); background: var(--deck); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pill.writing { color: var(--brass); border-color: var(--brass-dim); } .pill.writing i { background: var(--brass); box-shadow: 0 0 10px var(--brass); animation: blink 1s ease-in-out infinite; }
.pill.reading { color: var(--cyan); border-color: var(--cyan-dim); } .pill.reading i { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); animation: blink .6s ease-in-out infinite; }
.pill.off i { background: var(--bad); }
@keyframes blink { 50% { opacity: .35; } }

/* main */
.main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); gap: 14px; min-height: 0; }
@media (max-width: 900px) { .main { grid-template-columns: 1fr; } }
.deck { background: var(--deck); border: 1px solid var(--line); border-radius: 12px; min-width: 0; position: relative; overflow: hidden; }
.label { font: 500 11px var(--f-num); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }

.live { display: grid; grid-template-rows: auto auto auto auto; align-content: space-between; padding: 20px 22px 16px; gap: 6px; }
.speed { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.speed .n { font: 700 clamp(84px, 13vw, 168px)/.82 var(--f-num); letter-spacing: -.06em; font-variant-numeric: tabular-nums; transition: color .4s; }
.speed .u { font: 500 15px var(--f-num); color: var(--ink2); padding-bottom: 10px; }
.speed .side { margin-left: auto; text-align: right; padding-bottom: 8px; display: grid; gap: 2px; }
.speed .side b { font: 700 22px var(--f-num); }
.speed .side span { font-size: 12px; color: var(--muted); }
.live.writing .speed .n { color: var(--brass); text-shadow: 0 0 40px color-mix(in srgb, var(--brass) 35%, transparent); }
.status { font-size: 16px; color: var(--ink2); min-height: 24px; }
.status b { color: var(--ink); font-weight: 500; }
canvas { display: block; width: 100%; }
#belt { height: clamp(170px, 34vh, 380px); }
#trace { height: 70px; }
.beltnote { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }

.mem { display: grid; grid-template-rows: auto 1fr auto; padding: 18px 18px 16px; gap: 10px; }
.box { border: 1px solid var(--line); background: var(--deck2); border-radius: 9px; padding: 12px 13px; }
.box .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.box .hd b { font-weight: 700; font-size: 14px; }
.box .hd span { font: 12px var(--f-num); color: var(--ink2); }
.meter { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: #0b0e12; margin-top: 9px; }
.meter i { display: block; height: 100%; border-right: 2px solid var(--deck2); transition: flex-grow .8s ease; }
.meter i:last-child { border-right: 0; }
.m-w { background: var(--brass); } .m-k { background: var(--cyan); } .m-o { background: repeating-linear-gradient(135deg, #2a323c 0 4px, transparent 4px 8px); } .m-f { background: transparent; }
.keys { display: grid; gap: 3px; margin-top: 9px; font-size: 12.5px; color: var(--ink2); }
.keys div { display: flex; justify-content: space-between; gap: 8px; }
.keys i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 7px; }
.keys .num { color: var(--ink); }
.pipe { position: relative; min-height: 120px; display: grid; place-items: center; overflow: hidden; }
#pcie { contain: strict; }
#pcie { position: absolute; inset: 0; height: 100%; }
.pipe .cap { position: relative; font: 500 11px var(--f-num); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); background: var(--deck); padding: 3px 8px; border-radius: 4px; text-align: center; }
.pipe .cap b { display: block; font: 500 12px var(--f-num); letter-spacing: 0; text-transform: none; color: var(--ink2); margin-top: 2px; }

/* session strip */
.strip { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 900px) { .strip { grid-template-columns: 1fr; } }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 14px 6px; }
@media (max-width: 620px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 12px; } }
.stat { padding: 0 14px; border-left: 1px solid var(--line); }
.stat:first-child { border-left: 0; }
.stat b { display: block; font: 700 24px var(--f-num); letter-spacing: -.03em; }
.stat b small { font-size: 12px; font-weight: 400; color: var(--ink2); letter-spacing: 0; margin-left: 3px; }
.stat span { font-size: 12px; color: var(--muted); }
.events { padding: 12px 16px; display: grid; gap: 5px; align-content: start; }
.ev { display: grid; grid-template-columns: 44px 8px minmax(0, 1fr); gap: 9px; align-items: baseline; font-size: 13px; color: var(--ink2); animation: in .5s ease both; }
.ev time { font: 12px var(--f-num); color: var(--muted); }
.ev i { width: 7px; height: 7px; border-radius: 2px; background: var(--muted); align-self: center; }
.ev.good i { background: var(--good); } .ev.warn i { background: var(--warn); } .ev.bad i { background: var(--bad); } .ev.brass i { background: var(--brass); }
.ev.good, .ev.warn, .ev.bad { color: var(--ink); }
@keyframes in { from { opacity: 0; transform: translateY(4px); } }
.foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.foot a { color: var(--ink2); }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
@media (max-width: 520px) { body { padding: 0 16px; } .live { padding: 16px; } }
</style>
</head>
<body>
<div class="cockpit">
  <header class="bar">
    <div class="mark">
      <svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="bg1" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f4c56c"/><stop offset="1" stop-color="#c88a2c"/></linearGradient></defs>
        <path d="M13.2 3h5.6a2.2 2.2 0 0 1 2.2 2.2v5.3c0 2.6 3.4 6 3.4 11.4 0 4.4-4 7.1-8.4 7.1s-8.4-2.7-8.4-7.1c0-5.4 3.4-8.8 3.4-11.4V5.2A2.2 2.2 0 0 1 13.2 3z" fill="url(#bg1)"/>
        <circle cx="16" cy="7" r="1.6" fill="#090b0e"/></svg>
      shoehorn
    </div>
    <span class="tag" id="tModel">–</span>
    <span class="tag" id="tCtx"></span>
    <span class="tag" id="tKv"></span>
    <span class="sp"></span>
    <span class="pill" id="pill"><i></i><span id="pillText">connecting</span></span>
  </header>

  <section class="main">
    <div class="deck live" id="live">
      <span class="label" id="liveLabel">Writing speed</span>
      <div class="speed">
        <span class="n" id="spd">–</span><span class="u">tokens / s</span>
        <div class="side"><b class="num" id="sideN">–</b><span id="sideL">tokens this answer</span></div>
      </div>
      <canvas id="belt" aria-label="Tokens confirmed by each check of the full model"></canvas>
      <div>
        <canvas id="trace" aria-label="Writing speed over the last two minutes"></canvas>
        <div class="beltnote"><span id="beltNote">Each block group is the tokens one check of the full model confirmed.</span><span>speed, last 2 min</span></div>
      </div>
    </div>

    <div class="deck mem">
      <div class="box" id="gpu"></div>
      <div class="pipe"><canvas id="pcie"></canvas><span class="cap">PCIe<b id="pipeText">idle</b></span></div>
      <div class="box" id="ram"></div>
    </div>
  </section>

  <section class="strip">
    <div class="deck stats" id="stats"></div>
    <div class="deck events" id="events"></div>
  </section>
  <div class="foot"><span id="sessNote"></span><span>shoehorn dashboard · updates 4× a second</span></div>
</div>
<script>
const $ = id => document.getElementById(id);
const fmt = (v, d = 0) => v == null || !isFinite(v) ? "–" : Number(v).toLocaleString(undefined, { maximumFractionDigits: d, minimumFractionDigits: d });
const k = v => v == null ? "–" : v >= 1e6 ? fmt(v / 1e6, 1) + "M" : v >= 1e4 ? fmt(v / 1e3) + "K" : v >= 1e3 ? fmt(v / 1e3, 1) + "K" : fmt(v);
const GiB = 1073741824, gb = b => b == null ? "–" : fmt(b / GiB, 1);
const dur = s => s == null || !isFinite(s) ? "–" : s < 60 ? fmt(s, s < 10 ? 1 : 0) + " s" : s < 3600 ? Math.floor(s / 60) + " min" : fmt(s / 3600, 1) + " h";
const clock = t => new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const sum = (a, f) => a.reduce((s, r) => s + (f(r) || 0), 0);
const pct = (a, b) => b > 0 ? 100 * a / b : null;
const plural = (n, w, ws) => `${fmt(n)} ${n === 1 ? w : ws || w + "s"}`;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const C = { brass: "#e4ac4c", cyan: "#5cc0e6", muted: "#5d6874", line: "#1f2630", ink2: "#9aa4ae", bad: "#f06a6a" };
const GAP = 300;  // a session ends after 5 minutes without requests

let ALL = [], newest = -1, live = {}, cfg = {}, mem = {}, loaded = "";
let prevGen = null, prevT = null, rate = null, bursts = [], speedHist = [], lastSample = 0, beltT = 0;  // beltT: ms, advances only while busy

// ---------- canvases ----------
function fit(cv) {
  const r = cv.getBoundingClientRect(), dpr = Math.max(1, Math.min(2, devicePixelRatio || 1));
  const w = Math.max(10, Math.round(r.width * dpr)), h = Math.max(10, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { g, W: r.width, H: r.height };
}
// token belt: each poll's new tokens arrive as one group of blocks at the right edge and drift left
function drawBelt(now) {
  const { g, W, H } = fit($("belt"));
  g.clearRect(0, 0, W, H);
  const v = 70;  // px per second drift
  const bw = 7, gap = 2, rows = Math.max(3, Math.floor((H - 30) / (bw + gap)));
  // baseline grid
  g.strokeStyle = C.line; g.lineWidth = 1;
  for (let x = W; x > 0; x -= v * 5) { g.beginPath(); g.moveTo(Math.round(x) + .5, 6); g.lineTo(Math.round(x) + .5, H - 18); g.stroke(); }
  now = beltT;
  bursts = bursts.filter(b => W - (now - b.t) / 1000 * v > -120);
  for (const b of bursts) {
    const age = (now - b.t) / 1000, x0 = W - 8 - age * v - Math.ceil(b.n / rows) * (bw + gap);
    const cols = Math.ceil(b.n / rows), alpha = live.busy ? Math.max(.25, 1 - age / 14) : Math.max(.35, 1 - age / 14), fresh = Math.max(0, 1 - age * 3);
    g.fillStyle = b.miss ? C.bad : b.read ? C.cyan : C.brass;
    for (let i = 0; i < b.n; i++) {
      const c = Math.floor(i / rows), r = i % rows;
      const x = x0 + c * (bw + gap), y = H - 22 - (r + 1) * (bw + gap) - fresh * 10 * (1 - r / rows);
      g.globalAlpha = alpha;
      g.fillRect(x, y, bw, bw);
    }
    g.globalAlpha = Math.min(1, alpha + .2);
    if (cols >= 1 && b.n > 0) { g.fillStyle = C.ink2; g.font = "11px 'Chivo Mono', monospace"; g.textAlign = "center"; g.fillText(b.label || ("+" + b.n), x0 + cols * (bw + gap) / 2, H - 6); }
    g.globalAlpha = 1;
  }
  if (!live.busy && !bursts.length) {
    g.fillStyle = C.muted; g.font = "13px Chivo, sans-serif"; g.textAlign = "center";
    g.fillText(live.down ? "server offline" : "waiting for the next request", W / 2, H / 2);
  }
}
function drawTrace() {
  const { g, W, H } = fit($("trace"));
  g.clearRect(0, 0, W, H);
  const now = Date.now() / 1000, span = 120, pts = speedHist.filter(p => now - p.t <= span);
  const max = Math.max(30, ...pts.map(p => p.v || 0)) * 1.15;
  g.strokeStyle = C.line; g.beginPath(); g.moveTo(0, H - .5); g.lineTo(W, H - .5); g.stroke();
  if (!pts.some(p => p.v != null)) return;
  const X = t => W - (now - t) / span * W, Y = v => H - 3 - (H - 8) * v / max;
  g.beginPath(); let pen = false, firstX = 0, lastX = 0;
  for (const p of pts) { if (p.v == null) { pen = false; continue; } const x = X(p.t), y = Y(p.v); if (!pen) { g.moveTo(x, y); firstX = x; } else g.lineTo(x, y); pen = true; lastX = x; }
  g.strokeStyle = C.brass; g.lineWidth = 2; g.lineJoin = "round"; g.stroke();
  const grd = g.createLinearGradient(0, 0, 0, H); grd.addColorStop(0, "rgba(228,172,76,.28)"); grd.addColorStop(1, "rgba(228,172,76,0)");
  g.lineTo(lastX, H); g.lineTo(firstX, H); g.closePath(); g.fillStyle = grd; g.fill();
  g.fillStyle = C.muted; g.font = "11px 'Chivo Mono', monospace"; g.textAlign = "left"; g.fillText(fmt(max / 1.15) + " tok/s", 2, 11);
}
// PCIe: particles rising from RAM to the GPU while the residual streams (every check)
const parts = [];
function drawPcie(dt) {
  const { g, W, H } = fit($("pcie"));
  g.clearRect(0, 0, W, H);
  const cx = W / 2, lanes = [-18, -9, 0, 9, 18];
  g.strokeStyle = C.line; g.lineWidth = 1;
  for (const l of lanes) { g.beginPath(); g.moveTo(cx + l + .5, 0); g.lineTo(cx + l + .5, H); g.stroke(); }
  const streaming = live.busy && live.gen > 0, reading = live.busy && !(live.gen > 0);
  const rateP = streaming ? 90 : reading ? 40 : 0;   // particles per second
  if (!reduced) for (let i = 0; i < rateP * dt; i++) parts.push({ l: Math.floor(Math.random() * lanes.length), y: H + Math.random() * 10, v: 140 + Math.random() * 120, c: streaming ? C.brass : C.cyan });
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.y -= p.v * dt;
    if (p.y < -10) { parts.splice(i, 1); continue; }
    g.fillStyle = p.c; g.globalAlpha = .55 + .45 * (1 - Math.max(0, p.y) / H);
    g.fillRect(cx + lanes[p.l] - 1.5, p.y, 3, 8);
  }
  g.globalAlpha = 1;
}

// ---------- requests and sessions ----------
function annotate(R) {
  let main = null;
  let prevEnd = -Infinity;
  for (const r of R) {
    r.start = r.t - (r.prefill_s || 0) - (r.decode_s || 0);
    if (r.start - prevEnd > GAP) main = null;  // a new session: nothing to compare with
    prevEnd = Math.max(prevEnd, r.t);
    r.isSide = r.side === "parked" || r.side == null && main != null && main.prompt_tokens > 4000 && r.prompt_tokens < main.prompt_tokens * 0.4 && r.reused_tokens < 256;
    const fresh = r.prompt_tokens - r.reused_tokens;
    r.miss = !r.isSide && main != null && main.prompt_tokens > 2000 && r.prompt_tokens >= main.prompt_tokens * 0.8 && fresh > Math.max(2000, r.prompt_tokens * 0.5);
    r.loop = (r.reasoning_repeat || 0) > .3 || (r.content_repeat || 0) > .3;
    r.warmup = r.gen_tokens <= 2 && r.prompt_tokens < 300;
    if (!r.isSide && !r.warmup) main = r;
  }
}
function lastSession() {
  const S = [];
  for (const r of ALL) {
    if (r.warmup) continue;
    const c = S[S.length - 1];
    if (!c || r.start - c.end > GAP) S.push({ start: r.start, end: r.t, R: [r] });
    else { c.R.push(r); c.end = r.t; }
  }
  return S[S.length - 1];
}
const speedOf = R => { const D = R.filter(r => r.gen_tokens >= 16), d = sum(D, r => r.decode_s); return d > 0 ? sum(D, r => r.gen_tokens) / d : null; };

// ---------- DOM panels ----------
function renderTop(d) {
  $("tModel").innerHTML = d.loaded ? `<b>${d.loaded.replace(/^qwen3\.8-/, "").replace(/-shoehorn$/, "")}</b>` : "model <b>unloaded</b>";
  $("tCtx").innerHTML = cfg.ctx ? `context <b>${k(cfg.ctx)}</b>` : "";
  $("tKv").innerHTML = cfg.kv ? `KV <b>${cfg.kv}${cfg.kv_v && cfg.kv_v !== cfg.kv ? "/" + cfg.kv_v : ""}</b>${cfg.window ? ` · window <b>${k(cfg.window)}</b>` : ""}` : "";
  $("tCtx").hidden = !cfg.ctx; $("tKv").hidden = !cfg.kv;
}
function renderLive() {
  const L = live, writing = L.busy && L.gen > 0, reading = L.busy && !writing;
  $("pill").className = "pill" + (writing ? " writing" : reading ? " reading" : L.down ? " off" : "");
  $("pillText").textContent = L.down ? "offline" : writing ? "writing" : reading ? "reading" : loaded ? "idle" : "idle · GPU free";
  $("live").className = "deck live" + (writing ? " writing" : "");
  const last = [...ALL].reverse().find(r => r.gen_tokens >= 16);
  if (writing) {
    $("liveLabel").textContent = "Writing now";
    $("spd").textContent = fmt(rate ?? (L.elapsed_s > 0 ? L.gen / L.elapsed_s : 0), 0);
    $("sideN").textContent = fmt(L.gen); $("sideL").textContent = "tokens this answer";
  } else if (reading) {
    $("liveLabel").textContent = "Reading the prompt";
    $("spd").textContent = "…";
    $("sideN").textContent = k(L.prompt); $("sideL").textContent = "prompt tokens";
  } else {
    $("liveLabel").textContent = last ? "Last answer" : "Writing speed";
    $("spd").textContent = last ? fmt(last.gen_tokens / last.decode_s, 0) : "–";
    $("sideN").textContent = last ? fmt(last.gen_tokens) : "–"; $("sideL").textContent = last ? `tokens, ${dur(Date.now() / 1e3 - last.t)} ago` : "no answers yet";
  }
}
function renderMem() {
  const m = mem;
  if (!m.vram_total) { $("gpu").innerHTML = `<div class="hd"><b>Graphics card</b><span>–</span></div>`; $("ram").innerHTML = `<div class="hd"><b>System memory</b><span>–</span></div>`; return; }
  const vUsed = m.vram_total - m.vram_free, wG = loaded ? (m.weights_gpu || 0) : 0, wC = loaded ? (m.residual || 0) + (m.weights_cpu || 0) : 0, kv = m.kv_ram || 0;
  const vOther = Math.max(0, vUsed - wG), rUsed = m.ram_total - m.ram_avail, rOther = Math.max(0, rUsed - wC - kv);
  const box = (name, total, segs) => {
    const free = Math.max(0, total - segs.reduce((s, x) => s + x.b, 0));
    return `<div class="hd"><b>${name}</b><span>${gb(total - free)} / ${gb(total)} GB</span></div>
      <div class="meter">${[...segs, { c: "f", b: free }].map(x => x.b > 0 ? `<i class="m-${x.c}" style="flex-grow:${x.b}"></i>` : "").join("")}</div>
      <div class="keys">${segs.filter(x => x.b > 0).map(x => `<div><span><i class="m-${x.c}"></i>${x.l}</span><span class="num">${gb(x.b)}</span></div>`).join("")}</div>`;
  };
  $("gpu").innerHTML = box("Graphics card", m.vram_total, loaded
    ? [{ c: "w", b: wG, l: "base weights (4-bit)" }, { c: "k", b: vOther, l: "recent context, working memory" }]
    : [{ c: "o", b: vUsed, l: "desktop and other apps" }]);
  $("ram").innerHTML = box("System memory", m.ram_total, [{ c: "w", b: wC, l: "residual weights (the other 4 bits)" }, { c: "k", b: kv, l: "conversation memory" }, { c: "o", b: rOther, l: "everything else" }]);
  const writing = live.busy && live.gen > 0, reading = live.busy && !writing;
  $("pipeText").textContent = !loaded ? "model unloaded" : writing ? "residual streaming" : reading ? "reading prompt" : "idle";
}
function renderSession() {
  annotate(ALL);
  const s = lastSession();
  if (!s) { $("stats").innerHTML = `<div class="stat"><b>–</b><span>no sessions yet</span></div>`; $("events").innerHTML = ""; $("sessNote").textContent = ""; return; }
  const R = s.R, isLive = live.busy || Date.now() / 1e3 - s.end < GAP;
  const prompt = sum(R, r => r.prompt_tokens), reused = sum(R, r => r.reused_tokens), misses = R.filter(r => r.miss);
  const st = (v, u, l) => `<div class="stat"><b>${v}${u ? `<small>${u}</small>` : ""}</b><span>${l}</span></div>`;
  $("stats").innerHTML =
    st(dur((isLive ? Date.now() / 1e3 : s.end) - s.start), "", isLive ? "session so far" : "last session") +
    st(fmt(R.length), "", `requests · ${plural(sum(R, r => r.tool_calls), "tool call")}`) +
    st(k(sum(R, r => r.gen_tokens)), "", "tokens written") +
    st(fmt(speedOf(R), 0), "tok/s", "average speed") +
    st(fmt(pct(reused, prompt), 0), "%", misses.length ? `from cache · ${plural(misses.length, "miss", "misses")}` : "from cache");
  $("sessNote").textContent = `${isLive ? "Current" : "Last"} session started ${clock(s.start)}${s.start < Date.now() / 1e3 - 86400 ? " on " + new Date(s.start * 1000).toLocaleDateString() : ""}.`;
  const ev = [];
  for (const r of R) {
    if (r.miss) ev.push({ t: r.t, c: "bad", h: `Cache miss: re-read ${k(r.prompt_tokens - r.reused_tokens)} tokens (${dur(r.prefill_s)})` });
    else if (r.side === "resumed") ev.push({ t: r.t, c: "good", h: `Conversation resumed, ${k(r.reused_tokens)} tokens kept` });
    else if (r.side === "parked") ev.push({ t: r.t, c: "good", h: `Title request ran on the side slot` });
    else if (r.isSide) ev.push({ t: r.t, c: "", h: `Side request, ${k(r.prompt_tokens)} tokens` });
    if (r.loop) ev.push({ t: r.t, c: "warn", h: `Answer started repeating itself` });
    if (r.finish === "length") ev.push({ t: r.t, c: "warn", h: `Answer cut off at the token limit` });
    if (!r.miss && !r.isSide && r.gen_tokens >= 16) ev.push({ t: r.t, c: "", h: `Wrote ${fmt(r.gen_tokens)} tokens at ${fmt(r.gen_tokens / r.decode_s, 0)} tok/s${r.tool_calls ? " → " + plural(r.tool_calls, "tool call") : ""}` });
  }
  const html = ev.slice(-5).reverse().map(e => `<div class="ev ${e.c}"><time>${clock(e.t)}</time><i></i><span>${e.h}</span></div>`).join("");
  if ($("events").dataset.h !== html) { $("events").innerHTML = html; $("events").dataset.h = html; }
}

// ---------- polling ----------
async function poll() {
  let d;
  try { d = await (await fetch("/stats?since=" + newest, { cache: "no-store" })).json(); }
  catch (e) { live = { down: true }; renderLive(); return; }
  let added = false;
  for (const r of d.recent || []) if (r.t > newest) { ALL.push(r); newest = r.t; added = true; }
  const now = performance.now(), wall = Date.now() / 1000;
  const was = live;
  live = d.live || {}; cfg = d.config || {}; mem = d.mem || {}; loaded = d.loaded || "";
  // new tokens since the last poll arrive on the belt as one group (a check of the full model, or two)
  if (live.busy && live.gen > 0) {
    if (prevGen != null && live.gen > prevGen) {
      const n = live.gen - prevGen, dt = (now - prevT) / 1000;
      bursts.push({ t: beltT, n: Math.min(n, 120) });
      const inst = n / Math.max(dt, .05);
      rate = rate == null ? inst : rate * .7 + inst * .3;
    }
    if (prevGen == null || live.gen >= prevGen) { prevGen = live.gen; prevT = now; }
  } else {
    if (was.busy && !live.busy && prevGen != null) bursts.push({ t: beltT, n: 0, label: "done" });
    prevGen = null; rate = null;
  }
  if (live.busy && !(live.gen > 0) && !(was.busy && !(was.gen > 0))) bursts.push({ t: beltT, n: Math.min(60, Math.ceil((live.prompt || 0) / 400)), read: true, label: `read ${k(live.prompt)}` });
  if (wall - lastSample >= 1) { speedHist.push({ t: wall, v: live.busy && live.gen > 0 ? rate : null }); lastSample = wall; speedHist = speedHist.filter(p => wall - p.t <= 125); }
  renderTop(d); renderLive(); renderMem(); drawTrace();
  if (added || !poll.n || poll.n % 20 === 0) renderSession();
  poll.n = (poll.n || 0) + 1;
}
let lastFrame = performance.now();
function frame(t) {
  const real = Math.min(1, (t - lastFrame) / 1000), dt = Math.min(.1, real); lastFrame = t;
  if (live.busy) beltT += real * 1000;  // real time, so a throttled tab still keeps the belt honest
  drawBelt(t); drawPcie(dt);
  requestAnimationFrame(frame);
}
poll(); setInterval(poll, 250);
requestAnimationFrame(frame);
</script>
